[package]
name = "weft-package-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SDK for authoring Weft Core WASM capability packages"
readme = "README.md"
documentation = "https://docs.rs/weft-package-sdk"
keywords = ["weft", "wasm", "extism", "capability", "plugin"]
categories = ["development-tools", "wasm"]

[lib]
crate-type = ["lib"]

[dependencies]
base64 = "0.22"
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
