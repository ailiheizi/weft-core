# Minimal sidecar-http example config
# Copy to config.toml and replace the API key placeholder.

[core]
host = "127.0.0.1"
port = 17830
log_level = "info"
data_dir = "./core/examples/sidecar-http/data"

[routing]
default_provider = "deepseek"
default_model = "deepseek-chat"

[[providers]]
name = "deepseek"
base_url = "https://api.deepseek.com"
format = "openai"
models = ["deepseek-chat"]

[[providers.keys]]
value = "sk-your-deepseek-key"
