name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify workspace builds
        run: cargo build --workspace --release
      - name: Publish weft-package-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            cargo publish -p weft-package-sdk --allow-dirty && exit 0
            echo "crates.io publish attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "weft-package-sdk publish skipped (may already exist)"
      - name: Publish weft-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            cargo publish -p weft-core --allow-dirty && exit 0
            echo "crates.io publish attempt $i failed, retrying in 30s..."
            sleep 30
          done
          exit 1
