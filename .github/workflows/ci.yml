name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --release
      - name: Test weft-package-sdk
        run: cargo test -p weft-package-sdk
      - name: Test weft-core (standalone-safe)
        run: |
          cargo test -p weft-core --lib \
            --skip package_ui_route_serves_installed \
            --skip instance_config_loader_reads_instance \
            --skip product_package_declaration_loader \
            --skip weft_code_product_package_manifest \
            --skip repository_package_index_includes \
            --skip unmet_requirements_repo_index \
            --skip ui_metadata_prefers_existing \
            --skip test_load_current_official_package_manifests

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build weft-core binary
        run: cargo build -p weft-core --release --bin weft-core
